<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이어붙이기</title><style>body{margin:0;background:#07090d;color:#e7edf0;font-family:Arial,sans-serif}main{padding:30px}.eyebrow{color:#63e6d5;font:11px monospace;letter-spacing:.12em}.title{font-size:23px;font-weight:700;margin:10px 0}.line{height:5px;background:#1d2930;margin:24px 0 13px}.line i{display:block;height:100%;width:8%;background:#63e6d5;transition:width .35s}.message{color:#b0c0c7;font-size:13px;line-height:1.6}.foot{color:#72848b;font:10px monospace;margin-top:25px}</style></head>
<body><main><div class="eyebrow">LOCAL WORKER · NO UPLOAD</div><div class="title">원본 영상 이어붙이기</div><div class="line"><i id="bar"></i></div><div class="message" id="message">로컬 작업자를 준비하는 중입니다.</div><div class="foot">작업이 끝나면 이 창과 로컬 작업자는 자동으로 종료됩니다</div></main><script>const bar=document.getElementById('bar');const message=document.getElementById('message');window.concatWorker.onProgress((p)=>{const total=Number(p.total)||1;const current=Number(p.current)||0;bar.style.width=`${Math.max(8,Math.min(100,Math.round(current/total*92)+8))}%`;message.textContent=p.message||'처리 중입니다.';});</script></body>
</html>
