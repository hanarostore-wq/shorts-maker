<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이어붙이기</title><style>body{margin:0;background:#07090d;color:#e7edf0;font-family:Arial,sans-serif}main{padding:30px}.eyebrow{color:#63e6d5;font:11px monospace;letter-spacing:.12em}.title{font-size:23px;font-weight:700;margin:10px 0}.line{height:5px;background:#1d2930;margin:24px 0 13px}.line i{display:block;height:100%;width:2%;background:#63e6d5;transition:width .35s}.message{color:#b0c0c7;font-size:13px;line-height:1.6;white-space:pre-wrap}.foot{color:#72848b;font:10px monospace;margin-top:25px}</style></head>
<body><main><div class="eyebrow">LOCAL WORKER · NO UPLOAD</div><div class="title" id="title">원본 영상 이어붙이기</div><div class="line"><i id="bar"></i></div><div class="message" id="message">로컬 작업자를 준비하는 중입니다.</div><div class="foot" id="foot">이 창을 닫아도 이미 시작된 작업은 계속됩니다</div></main><script>const bar=document.getElementById('bar');const title=document.getElementById('title');const message=document.getElementById('message');const foot=document.getElementById('foot');function eta(v){if(!v||v<1)return'';v=Math.round(v);const m=Math.floor(v/60);return m?` · 약 ${m}:${String(v%60).padStart(2,'0')} 남음`:` · 약 ${v}초 남음`}window.concatWorker.onProgress((p)=>{if(p.phase==='error'){title.textContent='이어붙이기 제작실패';bar.style.width='100%';bar.style.background='#ef4444';message.style.color='#fca5a5';message.textContent=`상세 사유\n${p.message||'알 수 없는 오류가 발생했습니다.'}`;foot.textContent='이 창을 닫아도 원본 파일은 변경되지 않습니다 · 오류 내용은 직원 상태바에도 남습니다';return}const progress=Number.isFinite(p.progress)?p.progress:((Number(p.current)||0)/(Number(p.total)||1));bar.style.width=`${Math.max(2,Math.min(100,Math.round(progress*100)))}%`;message.textContent=p.message||'처리 중입니다.';foot.textContent=`진행 ${Math.round(progress*100)}%${eta(p.etaSeconds)} · 이 창을 닫아도 작업은 계속됩니다`;});</script></body>
</html>
