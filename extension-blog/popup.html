<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>머니OS 블로그 발행센터</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><strong>머니OS 블로그 발행센터</strong><span id="version"></span></header>
  <section class="status"><span class="dot"></span><span id="status">상태 확인 중</span></section>
  <button id="read" class="primary">현재 GPT 글 읽기</button>
  <button id="refresh" class="secondary">대기열 새로고침</button>
  <button id="reload" class="secondary">확장프로그램 새로고침</button>
  <button id="update" class="secondary">업데이트 확인</button>
  <div id="updateInfo" class="notice" hidden></div>
  <section><h2>발행 대기열 <span id="count">0</span></h2><div id="queue"></div></section>
  <footer><span>개발 버전: 파일 수정 후 확장프로그램 관리 화면에서 한 번만 새로고침</span><br><span>정식 배포판: 업데이트 확인 후 브라우저 정책에 따라 자동 반영</span></footer>
  <script src="popup.js"></script>
</body></html>
