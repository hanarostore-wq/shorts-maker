<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>상품 소싱</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, "Malgun Gothic", sans-serif;
      background: #0a0a0a;
      color: #f4f4f5;
      margin: 0;
      padding: 14px;
    }
    h1 {
      font-size: 13px;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: 2px solid #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #a1a1aa;
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>🛒 운영본부 · 상품 소싱</h1>
  <button id="scrapeBtn">지금 화면 소싱하기</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
