<!doctype html><meta charset="utf-8"><title>engine test</title>
<script type="module">
import { mergeStreams, remuxHls, copyFile } from '/extension/offscreen/engine.js';
async function opfsWritable(name) {
  const root = await navigator.storage.getDirectory();
  const fh = await root.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  return { fh, w };
}
async function upload(fh, name) {
  const file = await fh.getFile();
  await fetch('/upload?name=' + encodeURIComponent(name), { method: 'POST', body: file });
  return file.size;
}
window.runMerge = async (v, a, name, opt = {}) => {
  const { fh, w } = await opfsWritable(name);
  const counter = { bytes: 0 }; const prog = [];
  await mergeStreams({ video: { url: v, ...opt.v }, audio: a ? { url: a, ...opt.a } : null, title: 't' }, w, { counter, onProgress: (p) => prog.push(p.percent) });
  return { size: await upload(fh, name), bytes: counter.bytes, prog: prog.slice(-1) };
};
window.runHls = async (u, name, prefer) => {
  const { fh, w } = await opfsWritable(name);
  const counter = { bytes: 0 }; let q;
  await remuxHls({ url: u, prefer }, w, { counter, onQuality: (x) => (q = x), onProgress: () => {} });
  return { size: await upload(fh, name), quality: q };
};
window.runCopy = async (u, name) => {
  const { fh, w } = await opfsWritable(name);
  const counter = { bytes: 0 };
  const writer = { async write(buf, pos) { await w.write({ type: 'write', position: pos, data: buf }); } };
  try { await copyFile({ url: u }, writer, { counter, onProgress: () => {} }); await w.close(); }
  catch (e) { await w.abort?.(); return { error: e.toJSON ? e.toJSON() : String(e) }; }
  return { size: await upload(fh, name) };
};
window.ready = true;
</script>
