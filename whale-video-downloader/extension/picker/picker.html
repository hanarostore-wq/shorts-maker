<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>저장 폴더 선택 · 영상 다운로더</title>
  <link rel="stylesheet" href="../popup/popup.css" />
  <link rel="stylesheet" href="picker.css" />
</head>
<body class="picker">
  <header class="hero">
    <div class="brand">
      <img class="logo" src="../icons/icon48.png" alt="" width="40" height="40" />
      <div>
        <h1 id="title">저장 폴더 선택</h1>
        <p>다운로드한 영상이 이 폴더에 바로 저장됩니다</p>
      </div>
    </div>
  </header>
  <main>
    <div class="card big">
      <div class="folder">
        <div class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></div>
        <div class="grow">
          <strong id="current">선택된 폴더 없음</strong>
          <small id="state">아래 버튼을 눌러 폴더를 고르세요</small>
        </div>
      </div>
      <button class="btn huge" id="action">폴더 선택하기</button>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <div class="card tips">
      <strong>알아 두세요</strong>
      <ul>
        <li><b>다운로드·바탕화면 폴더 자체</b>는 브라우저 보안 정책상 고를 수 없어요. 그 안에 새 폴더(예: <code>영상</code>)를 만들어 선택하세요.</li>
        <li>브라우저를 다시 켜면 보안상 <b>권한을 한 번 더 허용</b>해야 할 수 있어요. 그 전에는 영상이 사라지지 않도록 기본 다운로드 폴더에 대신 저장돼요.</li>
        <li>같은 이름의 파일이 있으면 덮어쓰지 않고 <code>(1)</code>, <code>(2)</code>를 붙여 저장해요.</li>
      </ul>
    </div>
  </main>
  <script type="module" src="picker.js"></script>
</body>
</html>
