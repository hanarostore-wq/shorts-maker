<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>머니OS 상품소싱</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 16px; background: #18191b; color: #f5f5f5; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 16px; }
    p { margin: 0 0 14px; color: #a1a1aa; font-size: 11px; line-height: 1.5; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 11px 10px; background: #ff5647; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 34px; margin-top: 12px; white-space: pre-wrap; color: #a7f3d0; font-size: 11px; line-height: 1.45; }
    .rule { margin-top: 12px; padding-top: 10px; border-top: 1px solid #303236; color: #71717a; font-size: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>머니OS 상품소싱</h1>
  <p>현재 화면에 보이는 상품만 수집합니다.</p>
  <button id="scrapeBtn">지금 화면 소싱하기</button>
  <div id="status">준비됨</div>
  <div class="rule">상세페이지는 현재 상품 1개<br>목록페이지는 현재 표시된 상품만<br>자동 스크롤·무한 펼치기 없음</div>
  <script src="popup.js"></script>
</body>
</html>
